<!DOCTYPE html>
<html lang="pt-BR">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>Calculadoras Litoral — consórcio vs financiamento | Praia Digital</title><meta name="description" content="Compare consórcio e financiamento para comprar imóvel no litoral: custo total, parcelas e quando cada um vale a pena."><link rel="canonical" href="https://praia.digital/calculadoras-litoral/"><style>body{font-family:system-ui,-apple-system,sans-serif;margin:0;background:#f8fafc;color:#0f172a;line-height:1.6}.hero{background:linear-gradient(135deg,#0c4a6e,#0ea5e9);color:#fff;padding:60px 20px;text-align:center}.container{max-width:780px;margin:auto;padding:30px 20px}.card{background:#fff;border-radius:13px;padding:24px;margin-bottom:16px;box-shadow:0 3px 10px #0001}label{display:block;font-weight:600;margin:12px 0 4px}input{width:100%;padding:10px;border:1px solid #cbd5e1;border-radius:8px;font-size:1rem;box-sizing:border-box}button{background:#0ea5e9;color:#fff;border:0;padding:14px 28px;border-radius:10px;font-size:1.1rem;font-weight:700;cursor:pointer;width:100%;margin-top:16px}.vs{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:14px}.col{background:#f0f9fa;border-radius:10px;padding:16px;text-align:center}.col h3{margin-top:0;color:#0c4a6e}.win{border:2px solid #16a34a}a.app{color:#0c4a6e;font-weight:600}footer{text-align:center;padding:24px;color:#64748b}</style></head><body><header class="hero"><h1>⚖️ Calculadoras Litoral</h1><p>Consórcio ou financiamento? Compare o custo total para comprar na praia.</p></header><main class="container"><div class="card"><label>Valor do imóvel (R$)</label><input id="v" type="number" value="500000"><label>Entrada (R$)</label><input id="e" type="number" value="100000"><label>Prazo (anos)</label><input id="p" type="number" value="20"><label>Taxa de juros do financiamento (% a.a.)</label><input id="j" type="number" value="10.5" step="0.1"><label>Taxa de administração do consórcio (% total)</label><input id="adm" type="number" value="16"><button onclick="calc()">Comparar</button></div><div class="card" id="out" style="display:none"></div><div class="card"><strong>Explore mais:</strong><br>🏦 <a class="app" href="https://praia.digital/simulador-credito/">Simulador de Crédito</a> — FGTS e MCMV<br>🎯 <a class="app" href="https://praia.digital/plano-litoral/">Plano Litoral</a> — planeje a entrada<br>🧾 <a class="app" href="https://praia.digital/calculadora-custos/">Calculadora de Custos</a> — ITBI e cartório</div></main><footer><a class="app" href="https://praia.digital/apps/">🌐 Apps Praia Digital</a> · <a class="app" href="https://praia.digital/">praia.digital</a></footer><script>function calc(){var v=+document.getElementById('v').value,e=+document.getElementById('e').value,p=+document.getElementById('p').value*12,j=+document.getElementById('j').value/1200,adm=+document.getElementById('adm').value/100;var fin=v-e;var pmt=fin*j/(1-Math.pow(1+j,-p));var totalFin=pmt*p+e;var cons=v*(1+adm);var pmtCons=cons/p;var win=totalFin<cons?'fin':'cons';document.getElementById('out').style.display='block';document.getElementById('out').innerHTML='<div class="vs"><div class="col '+(win==='fin'?'win':'')+'"><h3>🏦 Financiamento</h3><p>Parcela: <strong>R$ '+pmt.toFixed(0)+'</strong></p><p>Total pago: <strong>R$ '+totalFin.toLocaleString('pt-BR',{maximumFractionDigits:0})+'</strong></p><p>Posse: imediata</p></div><div class="col '+(win==='cons'?'win':'')+'"><h3>🤝 Consórcio</h3><p>Parcela: <strong>R$ '+pmtCons.toFixed(0)+'</strong></p><p>Total pago: <strong>R$ '+cons.toLocaleString('pt-BR',{maximumFractionDigits:0})+'</strong></p><p>Posse: após contemplação</p></div></div><p style="text-align:center;margin-top:14px"><strong>'+(win==='fin'?'Financiamento sai mais barato neste cenário — e você se muda já.':'Consórcio sai mais barato — mas exige paciência para a contemplação.')+'</strong></p>';}</script></body></html>
